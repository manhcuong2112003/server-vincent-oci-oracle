name: Deploy Oracle A1 Always Free

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Thời gian phiên săn (phút)"
        type: number
        default: 15
      retry_interval:
        description: "Khoảng cách giữa các lần thử (giây)"
        type: number
        default: 45
  schedule:
    # Đánh thức mỗi 30 phút để chạy 1 phiên săn 15 phút
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Oracle Cloud SDK
        run: |
          python -m pip install --quiet --disable-pip-version-check oci

      - name: Configure Oracle credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          required = ['OCI_USER_OCID', 'OCI_TENANCY_OCID', 'OCI_FINGERPRINT', 'OCI_PRIVATE_KEY']
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit(f"Thiếu các secret sau trong GitHub Secrets: {', '.join(missing)}")

          target = Path.home() / '.oci'
          target.mkdir(mode=0o700, exist_ok=True)

          key_file = target / 'oci_api_key.pem'
          key_content = os.environ['OCI_PRIVATE_KEY'].strip()
          key_file.write_text(key_content + '\n', encoding='utf-8')
          key_file.chmod(0o600)

          config = target / 'config'
          config.write_text(
              f"[DEFAULT]\n"
              f"user={os.environ['OCI_USER_OCID'].strip()}\n"
              f"tenancy={os.environ['OCI_TENANCY_OCID'].strip()}\n"
              f"fingerprint={os.environ['OCI_FINGERPRINT'].strip()}\n"
              f"key_file={key_file}\n"
              f"region=ap-singapore-1\n",
              encoding='utf-8'
          )
          config.chmod(0o600)
          print("Cấu hình xác thực OCI thành công.")
          PY

      - name: Run hunting session
        id: hunter
        run: |
          python github_runner.py tick \
            --session-minutes "${{ inputs.session_minutes || 15 }}" \
            --retry-interval "${{ inputs.retry_interval || 45 }}"

      - name: Disable workflow on success
        if: always() && steps.hunter.outputs.terminal == 'true' && steps.hunter.outputs.success == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Máy chủ đã được tạo thành công! Tự động tắt workflow để tránh tạo trùng..."
          gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/oci-a1.yml/disable"
