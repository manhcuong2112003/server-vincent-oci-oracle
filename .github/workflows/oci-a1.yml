name: Deploy Oracle A1 Always Free

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oci-a1.yml'
      - 'github_runner.py'
      - 'oci_a1_hunter.py'
  workflow_dispatch:
    inputs:
      mode:
        description: "setup: create email subscription; tick: one deployment step; status: inspect progress"
        type: choice
        options: [setup, tick, status]
        default: setup
  schedule:
    # Wake every 15 minutes; remote state allows one scan per 45 minutes.
    # Extra wakeups let the next event recover a delayed/dropped schedule.
    - cron: '8,23,38,53 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-a1-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.HUNTER_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install OCI CLI and SDK
        run: python -m pip install --quiet --disable-pip-version-check 'oci-cli==3.95.1'
      - name: Configure Oracle credentials
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          names = ['OCI_USER_OCID', 'OCI_TENANCY_OCID', 'OCI_FINGERPRINT', 'OCI_PRIVATE_KEY']
          if any(not os.environ.get(name, '').strip() for name in names):
              raise SystemExit('Missing Oracle repository secrets. See README.')
          target = Path.home() / '.oci'
          target.mkdir(mode=0o700, exist_ok=True)
          key = target / 'github_api_key.pem'
          private_key = os.environ['OCI_PRIVATE_KEY'].strip()
          if not private_key.endswith('OCI_API_KEY'):
              private_key += '\nOCI_API_KEY'
          key.write_text(private_key + '\n', encoding='utf-8')
          key.chmod(0o600)
          config = target / 'config'
          config.write_text('[DEFAULT]\nuser={}\ntenancy={}\nfingerprint={}\nkey_file={}\nregion=ap-singapore-1\n'.format(
              os.environ['OCI_USER_OCID'].strip(), os.environ['OCI_TENANCY_OCID'].strip(),
              os.environ['OCI_FINGERPRINT'].strip(), key), encoding='utf-8')
          config.chmod(0o600)
          PY
      - name: One deployment step
        id: hunter
        env:
          MODE: ${{ inputs.mode || 'tick' }}
          MIN_INTERVAL_SECONDS: ${{ github.event_name == 'workflow_dispatch' && '0' || '2700' }}
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
        run: python github_runner.py "$MODE" --min-interval-seconds "$MIN_INTERVAL_SECONDS"
      - name: Stop schedule when deployment is complete or requires attention
        if: always() && steps.hunter.outputs.terminal == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/oci-a1.yml/disable"
